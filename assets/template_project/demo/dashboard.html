<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<style>
  :root {
    --brand: #1677ff;
    --text: #1f2329;
    --text-sub: #646a73;
    --border: #eaecef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: #f7f8fa;
  }
  .topbar {
    height: 56px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #4d9bff 0%, var(--brand) 55%, #0958d9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .brand-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: .3px;
  }
  .topbar .spacer { flex: 1; }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #eaf2ff;
    color: var(--brand);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 28px 48px; }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .2px;
  }
  .welcome {
    margin: 0 0 26px;
    font-size: 13.5px;
    color: var(--text-sub);
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(31, 35, 41, .04), 0 6px 20px rgba(31, 35, 41, .05);
    overflow: hidden;
  }
  .panel-head {
    padding: 15px 20px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  th {
    padding: 11px 20px;
    text-align: left;
    font-weight: 500;
    color: var(--text-sub);
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 13px 20px;
    border-bottom: 1px solid #f3f4f6;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fafbfc; }
  .tag {
    display: inline-block;
    padding: 2px 9px;
    font-size: 12px;
    border-radius: 20px;
    line-height: 1.7;
  }
  .tag-done { color: #12704f; background: #e7f7ef; }
  .tag-doing { color: #91540a; background: #fff4e2; }
  .tag-todo { color: #646a73; background: #f2f3f5; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--brand);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand-mark">D</span>
  <span class="brand-text">DEMO CONSOLE</span>
  <span class="spacer"></span>
  <span class="avatar">A</span>
</div>
<div class="wrap">
  <h1 data-testid="dashboard-title">工作台</h1>
  <p data-testid="dashboard-welcome" class="welcome">欢迎回来，<span id="current-user"></span></p>
  <div class="panel">
    <div class="panel-head">任务概览</div>
    <table data-testid="dashboard-table">
      <thead><tr><th>任务</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>订单同步</td><td><span class="tag tag-done">已完成</span></td></tr>
        <tr><td>库存核对</td><td><span class="tag tag-doing">进行中</span></td></tr>
        <tr><td>报表归档</td><td><span class="tag tag-todo">未开始</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
var m = /[?&]user=([^&]+)/.exec(window.location.search);
document.getElementById("current-user").textContent = m ? decodeURIComponent(m[1]) : "访客";
</script>
</body>
</html>
